name = "quick_note"
version = "1.0.0"
description = "Write Markdown notes in data/notes."
enabled-by-default = false

[[actions]]
id = "save"
description = "Save a Markdown note."
risk = "SAFE"
capabilities = ["file_write"]
target_paths = ["data/notes/{filename}"]

[actions.params]
filename = "str"
title = "str"
body = "str"
